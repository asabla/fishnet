[workspace]
members = ["crates/fishnet-core", "apps/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
ctrlc = "=3.5.2"
fishnet-core = { path = "crates/fishnet-core" }
tokio = { version = "=1.53.2", features = ["rt", "time", "sync", "macros", "process", "io-util", "net"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"
getrandom = "=0.2.17"
jsonwebtoken = { version = "=10.4.0", default-features = false, features = ["rust_crypto"] }
nix = { version = "=0.31.3", features = ["signal", "process"] }

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unused_lifetimes = "deny"
unused_qualifications = "deny"
unreachable_pub = "deny"
missing_debug_implementations = "deny"
non_ascii_idents = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
exit = "deny"
indexing_slicing = "deny"
cognitive_complexity = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[profile.release]
overflow-checks = true
